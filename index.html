<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOSPESC · Balanço hídrico + NEWS2</title>
<style>
:root{--bg:#f2f6fa;--card:#fff;--tx:#14263a;--mu:#5b6b7b;--pr:#0b5cab;--bd:#d6e0ea;--g:#1e8e3e;--y:#c98f00;--o:#ef7d00;--r:#d32f2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18232f;--tx:#e8eef4;--mu:#9fb0c0;--pr:#5aa6ff;--bd:#2a3a4a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:3px solid var(--pr);padding:8px 14px;display:flex;align-items:center;gap:10px}
header img{height:40px;border-radius:6px;background:#fff}
header h1{font-size:16px;margin:0;flex:1;line-height:1.2}header small{color:var(--mu);display:block;font-weight:400;font-size:12px}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
button{cursor:pointer}button.p{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
label{font-size:12px;color:var(--mu);display:block}input,select{width:100%}
.pt{display:flex;align-items:center;gap:12px;cursor:pointer}
.ini{font-size:20px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.b{min-width:46px;text-align:center;color:#fff;border-radius:8px;padding:6px 8px;font-weight:700;display:inline-block}
.l0{background:var(--g)}.l1{background:var(--y)}.l2{background:var(--o)}.l3{background:var(--r)}.ln{background:#8896a5}
h2{font-size:15px;margin:4px 0 8px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:var(--card);border-radius:14px;max-width:440px;width:100%;overflow:hidden;max-height:90%;overflow-y:auto}
.md .h{color:#fff;padding:14px 16px;font-weight:700;font-size:17px}.md .c{padding:14px 16px}
.md ul{padding-left:18px;margin:8px 0}
.tot{display:flex;gap:8px}.tot div{flex:1;text-align:center;border:1px solid var(--bd);border-radius:8px;padding:8px}.tot b{font-size:18px;display:block}
.bad{color:var(--r);font-weight:700}
#pr{display:none}
@media print{body{background:#fff;color:#000}header,main,.ov{display:none!important}#pr{display:block;font-size:11px}
#pr table{font-size:10px}#pr td,#pr th{border:1px solid #999;padding:2px 4px}#pr .pp{break-inside:avoid;margin-bottom:10px}#pr img{height:44px}}
</style></head><body>

 P.FC=x.fc<=40?3:x.fc<=50?1:x.fc<=90?0:x.fc<=110?1:x.fc<=130?2:3;
 P.Consciência=x.cv?3:0;
 P.Temp=x.t<=35?3:x.t<=36?1:x.t<=38?0:x.t<=39?1:2;
 const tot=Object.values(P).reduce((a,b)=>a+b,0);return{P,tot,any3:Object.values(P).includes(3)}}
function lvl(tot,a3){return tot>=7?3:tot>=5?2:(a3||tot>=3)?1:tot>=1?0:-1}
const LC=['l0','l1','l2','l3'];
const REC=[
['Risco baixo (1–4)','Enfermeiro avalia e decide se aumenta a frequência de monitorização.','Reavaliar sinais vitais a cada 4–6 h.'],
['Risco baixo-médio (3 em um parâmetro)','Avaliação urgente por enfermeiro/médico (resposta no setor).','Reavaliar em até 1 h e definir se há necessidade de escalonar.'],
['Risco médio (5–6)','Acionar médico plantonista para avaliação urgente.','Monitorizar no mínimo a cada 1 h; considerar equipe de resposta rápida/UTI.'],
['Risco alto (≥7)','EMERGÊNCIA: acionar equipe de resposta rápida/intensivista imediatamente.','Monitorização contínua; avaliar transferência para UTI.']];
const pt=()=>S.p.find(p=>p.id==V.id);
const lastV=p=>(p.vit||[])[(p.vit||[]).length-1];
function go(v,id){V.v=v;if(id)V.id=id;R()}
function R(){const a=$('app');$('back').style.display=V.v=='home'?'none':'';
 if(V.v=='home'||!pt()){V.v='home';home(a)}else detail(a)}
function badge(p){const v=lastV(p);if(!v)return'<span class="b ln">—</span>';return`<span class="b ${LC[Math.max(0,lvl(v.tot,v.any3))]}">${v.tot}</span>`}
function home(a){$('ttl').innerHTML=`Balanço hídrico + NEWS2<small>HOSPESC · CM · ● ${MODE}</small>`;
 const L=S.p.filter(p=>V.f=='Todos'||p.setor==V.f);
 a.innerHTML=`<div class="row" style="margin-bottom:10px"><select onchange="V.f=this.value;R()" style="flex:1">${['Todos',...SETORES].map(s=>`<option ${s==V.f?'selected':''}>${s}</option>`).join('')}</select><button class="p" onclick="addP()">+ Paciente</button><button onclick="prt()">🖨 Turno</button></div>`+
 (L.length?L.map(p=>`<div class="card pt" onclick="go('pt',${p.id})"><div class="sp"><div class="ini">${p.ini}</div><div class="mu">Leito ${p.leito} · ${p.setor}</div></div>${badge(p)}</div>`).join(''):'<p class="mu">Nenhum paciente neste setor. Toque em “+ Paciente”.</p>')+
 `<p class="mu">${SH?'Dados compartilhados com a equipe convidada. ':'Dados só neste aparelho. '}Use apenas iniciais. Não substitui o julgamento clínico nem o prontuário.</p>`}
function modal(c,t,h){const d=document.createElement('div');d.className='ov';d.id='ov';d.innerHTML=`<div class="md"><div class="h" style="background:${c}">${t}</div><div class="c">${h}</div></div>`;document.body.appendChild(d)}
function cl(){const o=$('ov');if(o)o.remove();if(PEND){PEND=0;R()}}
function addP(){modal('#0b5cab','Novo paciente',`<div class="grid"><div><label>Iniciais</label><input id="ni" maxlength="5" placeholder="M.S.A."></div><div><label>Leito</label><input id="nl"></div></div><label style="margin-top:8px">Setor</label><select id="ns">${SETORES.map(s=>`<option>${s}</option>`).join('')}</select><div class="row" style="margin-top:12px"><button class="sp" onclick="cl()">Cancelar</button><button class="p sp" onclick="sv()">Salvar</button></div>`)}
function sv(){const i=$('ni').value.trim().toUpperCase(),l=$('nl').value.trim();if(!i||!l)return;const p={id:Date.now(),ini:i,leito:l,setor:$('ns').value,vit:[],bal:[]};S.p.push(p);put(p);cl();R()}
function detail(a){const p=pt();$('ttl').innerHTML=`${p.ini} · Leito ${p.leito}<small>${p.setor} · ● ${MODE}</small>`;
 const f=(i,l,ph)=>`<div><label>${l}</label><input id="${i}" type="number" step="any" inputmode="decimal" placeholder="${ph||''}"></div>`;
 const I=[['oral','Oral/medic.'],['sng','SNG/SNE'],['soro','Soro'],['mev','Medic. EV'],['sang','Sangue/deriv.']],E=[['diu','Diurese'],['dren','Drenagem gást.'],['fez','Fezes'],['vom','Vômitos'],['drn','Dreno']];
 const bal=p.bal||[],vit=p.vit||[],sum=k=>bal.reduce((s,b)=>s+(b[k]||0),0),inf=sum('inf'),eli=sum('eli');
 a.innerHTML=`<div class="card row"><span class="mu">Setor</span><select onchange="chS(this.value)" class="sp">${SETORES.map(s=>`<option ${s==p.setor?'selected':''}>${s}</option>`).join('')}</select>${badge(p)}</div>
 <div class="card"><h2>Registrar sinais vitais</h2><div class="grid">${f('t','Temp °C','36.5')}${f('fr','FR irpm')}${f('fc','FC bpm')}${f('pas','PAS')}${f('pad','PAD')}${f('sp','SpO₂ %')}${f('hgt','HGT mg/dL')}</div>
 <div class="grid" style="margin-top:8px"><div><label>O₂ suplementar</label><select id="o2"><option value="0">Ar ambiente</option><option value="1">Em uso de O₂</option></select></div><div><label>Escala SpO₂</label><select id="esc"><option value="1">1 (padrão)</option><option value="2">2 (hipercapnia)</option></select></div><div><label>Consciência</label><select id="cv"><option value="0">Alerta</option><option value="1">Confuso/Voz/Dor/Não resp.</option></select></div><div><label>Rubrica</label><input id="rub" maxlength="8" value="${lsGet('rub')||''}"></div></div>
 <button class="p" style="width:100%;margin-top:10px" onclick="regV()">Registrar e calcular NEWS2</button></div>
 <div class="card"><h2>Histórico NEWS2</h2>${vit.length?`<div class="scroll"><table><tr><th>Hora</th><th>T</th><th>FR</th><th>FC</th><th>PA</th><th>PAM</th><th>SpO₂</th><th>HGT</th><th>NEWS2</th></tr>${vit.slice().reverse().map(x=>`<tr><td>${x.h}</td><td>${x.t}</td><td>${x.fr}</td><td>${x.fc}</td><td>${x.pas}/${x.pad}</td><td>${x.pam}</td><td>${x.sp}</td><td class="${x.hgt!=null&&(x.hgt<70||x.hgt>180)?'bad':''}">${x.hgt==null?'—':x.hgt}</td><td><span class="b ${LC[Math.max(0,lvl(x.tot,x.any3))]}" style="padding:2px 8px;min-width:0">${x.tot}</span></td></tr>`).join('')}</table></div>`:'<p class="mu">Sem registros.</p>'}</div>
 <div class="card"><h2>Balanço hídrico (mL)</h2><label>Infundido</label><div class="grid">${I.map(([i,l])=>f('b_'+i,l)).join('')}</div><label style="margin-top:8px">Eliminado</label><div class="grid">${E.map(([i,l])=>f('b_'+i,l)).join('')}</div>
 <button class="p" style="width:100%;margin:10px 0" onclick="regB()">Adicionar lançamento</button>
 <div class="tot"><div>Infundido<b>${inf}</b></div><div>Eliminado<b>${eli}</b></div><div>Diurese<b>${sum('diu')}</b></div><div>Balanço<b>${inf-eli>0?'+':''}${inf-eli}</b></div></div>
 ${bal.length?`<div class="scroll" style="margin-top:8px"><table><tr><th>Hora</th><th>Infund.</th><th>Elim.</th><th>Diurese</th><th>Parcial</th></tr>${bal.slice().reverse().map(b=>`<tr><td>${b.h}</td><td>${b.inf}</td><td>${b.eli}</td><td>${b.diu||0}</td><td>${b.inf-b.eli}</td></tr>`).join('')}</table></div>`:''}</div>
 <button onclick="alta()" style="width:100%">Dar alta / remover paciente</button>`;
 window._I=I;window._E=E}
function chS(s){const p=pt();p.setor=s;put(p);R()}
function alta(){const p=pt();modal('#d32f2f','Remover paciente?',`<p>${p.ini} · Leito ${p.leito} e todos os registros serão apagados${SH?' para toda a equipe':''}.</p><div class="row"><button class="sp" onclick="cl()">Cancelar</button><button class="p sp" style="background:var(--r);border-color:var(--r)" onclick="del()">Remover</button></div>`)}
function del(){const p=pt();S.p=S.p.filter(x=>x!==p);if(DB)DB.collection('patients').doc(String(p.id)).delete();else lsSet('hospesc',JSON.stringify(S));cl();go('home')}
function regB(){const p=pt(),g=a=>a.reduce((s,[i])=>s+(n('b_'+i)||0),0),inf=g(_I),eli=g(_E);if(!inf&&!eli)return;(p.bal=p.bal||[]).push({h:now(),ts:Date.now(),inf,eli,diu:n('b_diu')||0});put(p);R()}
function regV(){const p=pt(),x={t:n('t'),fr:n('fr'),fc:n('fc'),pas:n('pas'),pad:n('pad'),sp:n('sp'),o2:$('o2').value=='1',esc:+$('esc').value,cv:$('cv').value=='1'};
 if([x.t,x.fr,x.fc,x.pas,x.pad,x.sp].some(v=>v===null)){alert('Preencha todos os sinais vitais.');return}
 const r=news(x);x.tot=r.tot;x.any3=r.any3;x.P=r.P;x.h=now();x.ts=Date.now();x.hgt=n('hgt');x.rub=$('rub').value.trim();lsSet('rub',x.rub);x.pam=Math.round((x.pas+2*x.pad)/3);(p.vit=p.vit||[]).push(x);put(p);R();
 const L=lvl(r.tot,r.any3),par=Object.entries(r.P).filter(([k,v])=>v>0).map(([k,v])=>`${k}: ${v}`).join(' · ')||'Nenhum';
 if(L>=1){const c=REC[L];modal(['','#c98f00','#ef7d00','#d32f2f'][L],`⚠ NEWS2 = ${r.tot} — ${c[0]}`,`<p><b>Paciente ${p.ini} · Leito ${p.leito} · ${p.setor}</b></p><p class="mu">Parâmetros pontuados: ${par}</p><ul><li>${c[1]}</li><li>${c[2]}</li></ul><button class="p" style="width:100%" onclick="cl()">Ciente</button>`)}
 else modal('#1e8e3e',`NEWS2 = ${r.tot}`,`<p>${r.tot?REC[0][1]+' '+REC[0][2]:'Risco baixo (0). Manter monitorização de rotina (mín. a cada 12 h).'}</p><button class="p" style="width:100%" onclick="cl()">OK</button>`)}
function prt(){modal('#0b5cab','Imprimir turno',`<label>Turno</label><select id="pt_t">${TURNOS.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join('')}</select><label>Profissional (nome e COREN)</label><input id="pt_n" value="${(lsGet('pnome')||'').replace(/"/g,'')}"><label style="margin-top:8px">Setor</label><select id="pt_s"><option>Todos</option>${SETORES.map(s=>`<option ${s==V.f?'selected':''}>${s}</option>`).join('')}</select>
 <div class="row" style="margin-top:12px"><button class="sp" onclick="cl()">Cancelar</button><button class="sp" onclick="doPrint()">Imprimir direto</button><button class="p sp" onclick="svF()">Salvar p/ imprimir</button></div>`)}
function sheet(){const [tn,a,b]=TURNOS[+$('pt_t').value],st=$('pt_s').value,nm=$('pt_n').value.trim(),_s=lsSet('pnome',nm),lim=Date.now()-864e5;
 const inS=ts=>{if(!ts||ts<lim)return false;const h=new Date(ts).getHours();return a<b?h>=a&&h<b:h>=a||h<b};
 const L=S.p.filter(p=>st=='Todos'||p.setor==st);
 return`<div style="display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px"><img src="${LOGO}" alt="HOSPESC"><div><b style="font-size:15px">Balanço hídrico + NEWS2 — ${tn}</b><br>Setor: ${st} · Impresso em ${new Date().toLocaleString('pt-BR')}</div></div>`+
 (L.map(p=>{const v=(p.vit||[]).filter(x=>inS(x.ts)),bl=(p.bal||[]).filter(x=>inS(x.ts)),I=bl.reduce((s,x)=>s+x.inf,0),E=bl.reduce((s,x)=>s+x.eli,0),D=bl.reduce((s,x)=>s+(x.diu||0),0);
  return`<div class="pp"><b>${p.ini} · Leito ${p.leito} · ${p.setor}</b>`+
  (v.length?`<table style="width:100%;border-collapse:collapse"><tr><th>Hora</th><th>T</th><th>FR</th><th>FC</th><th>PA</th><th>PAM</th><th>SpO₂</th><th>HGT</th><th>NEWS2</th><th>Rubrica</th></tr>${v.map(x=>`<tr><td>${x.h}</td><td>${x.t}</td><td>${x.fr}</td><td>${x.fc}</td><td>${x.pas}/${x.pad}</td><td>${x.pam}</td><td>${x.sp}</td><td>${x.hgt==null?'':x.hgt}</td><td>${x.tot}</td><td>${x.rub||''}</td></tr>`).join('')}</table>`:'<div>Sem sinais vitais no turno.</div>')+
  `<div style="margin-top:3px">Infundido: <b>${I}</b> mL · Eliminado: <b>${E}</b> mL (diurese ${D} mL) · Balanço do turno: <b>${I-E>0?'+':''}${I-E}</b> mL</div></div>`}).join('')||'<p>Nenhum paciente.</p>')+`<div style="display:flex;gap:28px;margin-top:8px;break-inside:avoid"><div style="flex:1;margin-top:32px;border-top:1px solid #000;padding-top:3px">${nm.replace(/</g,'&lt;')||'Nome e COREN do profissional'}</div><div style="flex:1;margin-top:32px;border-top:1px solid #000;padding-top:3px">Assinatura</div></div>`}
function doPrint(){const h=sheet();cl();$('pr').innerHTML=h;try{window.print()}catch(e){alert('Impressão indisponível aqui. Use “Salvar p/ imprimir”.')}}
async function svF(){const h=sheet();cl();try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:'turno-hospesc.html',data:`<!DOCTYPE html><meta charset="utf-8"><title>Turno HOSPESC</title><style>body{font:12px sans-serif;margin:16px}img{height:44px}td,th{border:1px solid #999;padding:2px 4px;font-size:11px}.pp{margin-bottom:12px;break-inside:avoid}</style><button onclick="print()" style="margin-bottom:10px;padding:8px 14px">🖨 Imprimir</button><style media="print">button{display:none}</style>${h}<script>setTimeout(()=>print(),500)<\/script>`})}catch(e){alert('Salvar arquivo indisponível aqui. Tente “Imprimir”.')}}
init();
</script></body></html>
