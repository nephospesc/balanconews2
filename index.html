<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOSPESC · Balanço hídrico + NEWS2</title>
<style>
:root{--bg:#f2f6fa;--card:#fff;--tx:#14263a;--mu:#5b6b7b;--pr:#0b5cab;--bd:#d6e0ea;--g:#1e8e3e;--y:#c98f00;--o:#ef7d00;--r:#d32f2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18232f;--tx:#e8eef4;--mu:#9fb0c0;--pr:#5aa6ff;--bd:#2a3a4a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:3px solid var(--pr);padding:8px 14px;display:flex;align-items:center;gap:10px}
header img{height:40px;border-radius:6px;background:#fff}
header h1{font-size:16px;margin:0;flex:1;line-height:1.2}header small{color:var(--mu);display:block;font-weight:400;font-size:12px}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
button{cursor:pointer}button.p{background:var(--pr);color:#fff;border-color:var(--pr)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
label{font-size:12px;color:var(--mu);display:block}input,select{width:100%}
.pt{display:flex;align-items:center;gap:12px;cursor:pointer}
.ini{font-size:20px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.b{min-width:46px;text-align:center;color:#fff;border-radius:8px;padding:6px 8px;font-weight:700;display:inline-block}
.l0{background:var(--g)}.l1{background:var(--y)}.l2{background:var(--o)}.l3{background:var(--r)}.ln{background:#8896a5}
h2{font-size:15px;margin:4px 0 8px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:var(--card);border-radius:14px;max-width:440px;width:100%;overflow:hidden;max-height:90%;overflow-y:auto}
.md .h{color:#fff;padding:14px 16px;font-weight:700;font-size:17px}.md .c{padding:14px 16px}
.md ul{padding-left:18px;margin:8px 0}
.tot{display:flex;gap:8px}.tot div{flex:1;text-align:center;border:1px solid var(--bd);border-radius:8px;padding:8px}.tot b{font-size:18px;display:block}
.bad{color:var(--r);font-weight:700}
#pr{display:none}
@media print{body{background:#fff;color:#000}header,main,.ov{display:none!important}#pr{display:block;font-size:11px}
#pr table{font-size:10px}#pr td,#pr th{border:1px solid #999;padding:2px 4px}#pr .pp{break-inside:avoid;margin-bottom:10px}#pr img{height:44px}}
</style></head><body>

async function api(fn,args){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),30000);

  let j;try{j=await r.json()}catch(e){const x=new Error('resposta inválida do servidor');x.net=1;throw x}
  if(!j.ok){const x=new Error(String(j.error||'Erro').replace(/^AUTH:\s*/,''));if(/^AUTH:/.test(j.error))x.auth=1;throw x}return j.data}finally{clearTimeout(tm)}}

 else if(o.op=='delP')P.splice(P.indexOf(p),1);

  c.innerHTML=`<div class="scroll"><table><tr><th>Nome</th><th>Registro</th><th>Situação</th><th>Último acesso</th><th></th></tr>${u.map(x=>{const eu=x.registro==USR.registro;return`<tr><td style="text-align:left;white-space:normal">${esc(x.nome)}</td><td>${esc(x.registro)}</td><td>${esc(x.status)}${x.perfil=='admin'?' (adm)':''}</td><td>${esc(x.ultimo)}</td><td>${eu?'':x.status=='ativo'?`<button onclick="admSet('${x.chave}','inativo')">Desativar</button>`:`<button class="p" onclick="admSet('${x.chave}','ativo')">${x.status=='pendente'?'Aprovar':'Reativar'}</button>`}</td></tr>`}).join('')}</table></div><button style="width:100%;margin-top:10px" onclick="cl()">Fechar</button>`}).catch(e=>msg(e.message))}

function aud(){modal('#0b5cab','Auditoria — últimas 60 alterações','<p class="mu">Carregando…</p>');wide();
 api('listAuditoria',[]).then(a=>{const c=document.querySelector('#ov .c');if(!c)return;
  c.innerHTML=`<div class="scroll"><table><tr><th>Quando</th><th>Profissional</th><th>Ação</th><th>Paciente</th><th>Antes → Depois</th></tr>${a.map(x=>`<tr><td>${esc(x.quando)}</td><td style="white-space:normal;text-align:left">${esc(x.usuario)}<br><span class="mu">${esc(x.registro)}</span></td><td style="white-space:normal;text-align:left">${esc(x.acao)}</td><td>${esc(x.paciente)}</td><td style="white-space:normal;text-align:left;font-size:11px">${esc(x.antes)}${x.antes&&x.depois?' → ':''}${esc(x.depois)}</td></tr>`).join('')}</table></div><p class="mu">O histórico completo fica na aba “Auditoria” da planilha.</p><button style="width:100%;margin-top:10px" onclick="cl()">Fechar</button>`}).catch(e=>msg(e.message))}
function cleanIni(s){return String(s||'').trim().toUpperCase().replace(/[^A-Z0-9ÀÁÂÃÇÉÊÍÓÔÕÚ. -]/g,'').slice(0,5)}
function sv(){const i=cleanIni($('ni').value),l=$('nl').value.trim().replace(/[^A-Za-z0-9 ._-]/g,'').slice(0,10),s=$('ns').value;if(!i||!l){msg('Preencha as iniciais e o leito.','#c98f00');return}
 const pid='p'+rid().slice(1);cl();enq({op:'addP',fn:'addPatient',pid,a:{ini:i,leito:l,setor:s},args:[i,l,s,pid]})}
function chS(s){enq({op:'setS',fn:'setSetor',pid:V.id,a:{setor:s},args:[V.id,s]})}
function del(){const mo=$('mo').value,ds=$('dst').value.trim(),pid=V.id;cl();V.v='home';enq({op:'delP',fn:'removePatient',pid,args:[pid,mo,ds]})}
function regB(){const p=pt(),g=a=>a.reduce((s,[i])=>s+(n('b_'+i)||0),0),itens=[];
 ['E','S'].forEach(t=>XT[t].forEach(x=>{const ml=parseFloat(x.ml);if(!isNaN(ml)&&ml>0)itens.push({t,nome:String(x.nome||'').trim().slice(0,30)||(t=='E'?'Outra entrada':'Outra saída'),ml})}));
 const so=t=>itens.filter(i=>i.t==t).reduce((s,i)=>s+i.ml,0),x={inf:g(_I)+so('E'),eli:g(_E)+so('S'),diu:n('b_diu')||0,itens};
 if(!x.inf&&!x.eli){msg('Preencha ao menos um valor de entrada ou saída.','#c98f00');return}
 XT={E:[],S:[]};clearDraft(p.id,k=>k.startsWith('b_')||k=='XT');
 const id=rid(),ts=Date.now();enq({op:'addB',fn:'addBalance',pid:p.id,rid:id,ts,h:now(),por:me(),x,args:[p.id,x,id,ts]})}
function regV(){const p=pt(),x={t:n('t'),fr:n('fr'),fc:n('fc'),pas:n('pas'),pad:n('pad'),sp:n('sp'),o2:$('o2').value=='1',esc:+$('esc').value,cv:$('cv').value=='1',hgt:n('hgt'),rub:$('rub').value.trim()};
 if(['t','fr','fc','pas','pad','sp','hgt'].every(k=>x[k]===null)){msg('Preencha ao menos um sinal vital.','#c98f00');return}
 lsSet('rub',x.rub);const falta=[['t','Temp'],['fr','FR'],['fc','FC'],['pas','PAS'],['sp','SpO₂']].filter(([k])=>x[k]===null).map(a=>a[1]),r=falta.length?null:news(x);
 clearDraft(p.id,k=>['t','fr','fc','pas','pad','sp','hgt','o2','esc','cv','rub'].includes(k));
 const id=rid(),ts=Date.now();enq({op:'addV',fn:'addVitals',pid:p.id,rid:id,ts,h:now(),por:me(),x,args:[p.id,x,id,ts]});
 if(!r){modal('#5b6b7b','Sinais vitais registrados',`<p>NEWS2 não calculado: faltam ${falta.join(', ')}.</p><button class="p" style="width:100%" onclick="cl()">OK</button>`);return}
 const L=lvl(r.tot,r.any3),par=Object.entries(r.P).filter(([k,v])=>v>0).map(([k,v])=>`${k}: ${v}`).join(' · ')||'Nenhum';
 if(L>=1){const c=REC[L];modal(['','#c98f00','#ef7d00','#d32f2f'][L],`⚠ NEWS2 = ${r.tot} — ${c[0]}`,`<p><b>Paciente ${p.ini} · Leito ${p.leito} · ${p.setor}</b></p><p class="mu">Parâmetros pontuados: ${par}</p><ul><li>${c[1]}</li><li>${c[2]}</li></ul><button class="p" style="width:100%" onclick="cl()">Ciente</button>`)}
 else modal('#1e8e3e',`NEWS2 = ${r.tot}`,`<p>${r.tot?REC[0][1]+' '+REC[0][2]:'Risco baixo (0). Manter monitorização de rotina (mín. a cada 12 h).'}</p><button class="p" style="width:100%" onclick="cl()">OK</button>`)}
function findRec(k,r){const p=pt();return p&&(k=='V'?p.vit:p.bal).find(x=>x.rid==r)}
function editV(r){const x=findRec('V',r);if(!x)return;const f=(i,l,v)=>`<div><label>${l}</label><input id="e_${i}" type="number" step="any" inputmode="decimal" value="${v==null?'':v}"></div>`;
 modal('#0b5cab','Editar sinais vitais — '+x.h,`<p class="mu">Registrado por ${esc(x.por||'—')}${x.ed&&x.ed!='editado agora'?' · última edição: '+esc(x.ed):''}</p><div class="grid">${f('t','Temp °C',x.t)}${f('fr','FR',x.fr)}${f('fc','FC',x.fc)}${f('pas','PAS',x.pas)}${f('pad','PAD',x.pad)}${f('sp','SpO₂',x.sp)}${f('hgt','HGT',x.hgt)}</div>
 <div class="grid" style="margin-top:8px"><div><label>O₂ suplementar</label><select id="e_o2"><option value="0">Ar ambiente</option><option value="1" ${x.o2?'selected':''}>Em uso de O₂</option></select></div><div><label>Escala SpO₂</label><select id="e_esc"><option value="1">1 (padrão)</option><option value="2" ${x.esc==2?'selected':''}>2 (hipercapnia)</option></select></div><div><label>Consciência</label><select id="e_cv"><option value="0">Alerta</option><option value="1" ${x.cv?'selected':''}>Confuso/Voz/Dor/Não resp.</option></select></div><div><label>Rubrica</label><input id="e_rub" maxlength="8" value="${esc(x.rub||'')}"></div></div>
 <div class="row" style="margin-top:12px"><button onclick="cl()">Cancelar</button><button onclick="askDel('V','${r}')" style="color:var(--r)">Excluir</button><button class="p sp" onclick="saveV('${r}')">Salvar alteração</button></div>`)}
function saveV(r){const x={t:n('e_t'),fr:n('e_fr'),fc:n('e_fc'),pas:n('e_pas'),pad:n('e_pad'),sp:n('e_sp'),hgt:n('e_hgt'),o2:$('e_o2').value=='1',esc:+$('e_esc').value,cv:$('e_cv').value=='1',rub:$('e_rub').value.trim()};
 if(['t','fr','fc','pas','pad','sp','hgt'].every(k=>x[k]===null)){msg('Preencha ao menos um sinal vital.','#c98f00');return}
 const pid=V.id;cl();enq({op:'updV',fn:'updateVitals',pid,rid:r,x,args:[r,x]})}
function editB(r){const x=findRec('B',r);if(!x)return;const f=(i,l,v)=>`<div><label>${l}</label><input id="e_${i}" type="number" step="any" inputmode="decimal" value="${v==null?'':v}"></div>`;
 modal('#0b5cab','Editar lançamento do balanço — '+x.h,`<p class="mu">Registrado por ${esc(x.por||'—')}${x.ed&&x.ed!='editado agora'?' · última edição: '+esc(x.ed):''}</p><div class="grid">${f('inf','Infundido (mL)',x.inf)}${f('eli','Eliminado (mL)',x.eli)}${f('diu','Diurese (mL)',x.diu)}</div><p class="mu">Os valores acima são os totais deste lançamento (já incluem os itens extras${(x.itens||[]).length?': '+(x.itens||[]).map(i=>(i.t=='E'?'+':'−')+i.ml+' '+esc(i.nome)).join('; '):''}).</p>
 <div class="row" style="margin-top:12px"><button onclick="cl()">Cancelar</button><button onclick="askDel('B','${r}')" style="color:var(--r)">Excluir</button><button class="p sp" onclick="saveB('${r}')">Salvar alteração</button></div>`)}
function saveB(r){const x={inf:n('e_inf')||0,eli:n('e_eli')||0,diu:n('e_diu')||0};const pid=V.id;cl();enq({op:'updB',fn:'updateBalance',pid,rid:r,x,args:[r,x]})}
function askDel(k,r){cl();modal('#d32f2f','Excluir registro?',`<p>Este registro será apagado para toda a equipe e não dá para desfazer.</p><div class="row"><button class="sp" onclick="cl()">Cancelar</button><button class="p sp" style="background:var(--r);border-color:var(--r)" onclick="doDel('${k}','${r}')">Excluir</button></div>`)}
function doDel(k,r){const pid=V.id;cl();enq({op:k=='V'?'delV':'delB',fn:k=='V'?'deleteVitals':'deleteBalance',pid,rid:r,args:[r]})}
function prt(pre){const d=new Date();if(d.getHours()<7)d.setDate(d.getDate()-1);const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 modal('#0b5cab','Imprimir plantão',`<label>Paciente</label><select id="pt_p"><option value="">Todos do setor escolhido abaixo</option>${S.p.map(p=>`<option value="${p.id}" ${p.id==pre?'selected':''}>${p.ini} · Leito ${p.leito} · ${p.setor}</option>`).join('')}</select><label style="margin-top:8px">Plantão</label><select id="pt_t"><option value="0">${TURNOS[0][0]}</option><option value="1">${TURNOS[1][0]}</option><option value="2">Os dois: diurno + noturno (com resumo 24 h)</option><option value="3">Últimas 48 h (tudo o que o app guarda)</option></select>
 <label style="margin-top:8px">Data de início do plantão</label><input type="date" id="pt_d" value="${ds}">
 <label style="margin-top:8px">Profissional (nome e COREN)</label><input id="pt_n" value="${esc(me())}" readonly>
 <label style="margin-top:8px">Setor (usado quando não escolher um paciente)</label><select id="pt_s"><option>Todos</option>${SETORES.map(s=>`<option ${s==V.f?'selected':''}>${s}</option>`).join('')}</select>
 <p class="mu" style="margin:8px 0 0">O noturno começa às 19h da data escolhida e termina às 7h do dia seguinte. O app guarda as últimas 48 h.</p>
 <div class="row" style="margin-top:12px"><button class="sp" onclick="cl()">Cancelar</button><button class="p sp" onclick="doPrint()">Imprimir</button></div>`)}
function sheet(){const sel=+$('pt_t').value,st=$('pt_s').value,pid=$('pt_p').value,nm=$('pt_n').value.trim(),_s=lsSet('pnome',nm);
 let ds=($('pt_d').value||'').split('-').map(Number);if(ds.length<3||ds.some(isNaN)){const t=new Date();ds=[t.getFullYear(),t.getMonth()+1,t.getDate()]}
 const L=S.p.filter(p=>pid?p.id==pid:(st=='Todos'||p.setor==st)),stl=pid&&L[0]?L[0].setor:st,fmt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
 const win=i=>{if(i==3){const t=Date.now();return{tn:'Últimas 48 h (todo o período guardado no app)',s0:t-48*36e5,e0:t}}const [tn,a,b]=TURNOS[i],s0=new Date(ds[0],ds[1]-1,ds[2],a,0,0).getTime();return{tn,s0,e0:s0+(((b-a+24)%24)||24)*36e5}};
 const stat=(p,w)=>{const inS=ts=>ts>=w.s0&&ts<w.e0,v=(p.vit||[]).filter(x=>inS(x.ts)),bl=(p.bal||[]).filter(x=>inS(x.ts));
  return{v,bl,O:bl.flatMap(x=>x.itens||[]),I:bl.reduce((s,x)=>s+x.inf,0),E:bl.reduce((s,x)=>s+x.eli,0),D:bl.reduce((s,x)=>s+(x.diu||0),0)}};
 const sg=`<div style="font-size:9px;margin-top:4px">* registro editado após o lançamento (histórico de alterações guardado na auditoria do sistema).</div><div style="display:flex;gap:28px;margin-top:8px;break-inside:avoid"><div style="flex:1;margin-top:32px;border-top:1px solid #000;padding-top:3px">${nm.replace(/</g,'&lt;')||'Nome e COREN do profissional'}</div><div style="flex:1;margin-top:32px;border-top:1px solid #000;padding-top:3px">Assinatura</div></div>`;
 const hd=(t,w)=>`<div style="display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px"><img src="${LOGO}" alt="HOSPESC"><div><b style="font-size:15px">${t}</b><br>Período: ${fmt(w.s0)} a ${fmt(w.e0)}<br>Setor: ${stl} · Impresso em ${new Date().toLocaleString('pt-BR')}</div></div>`;
 const sg2=v=>(v>0?'+':'')+v,e_=v=>v==null?'':v,hh=x=>sel==3?new Date(x.ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):x.h;
 const part=(i,k)=>{const w=win(i);
  return`<div style="${k?'break-before:page;':''}">`+hd('Balanço hídrico + NEWS2 — '+(i==3?'':'Plantão ')+w.tn,w)+(pid?'<div style="border:1px dashed #666;height:58px;margin-bottom:8px;padding:4px;font-size:10px">Etiqueta do paciente / nº do prontuário</div>':'')+
  (L.map(p=>{const {v,bl,O,I,E,D}=stat(p,w);
   return`<div class="pp"><b>${p.ini} · Leito ${p.leito} · ${p.setor}</b>`+
   (v.length?`<table style="width:100%;border-collapse:collapse"><tr><th>Hora</th><th>T</th><th>FR</th><th>FC</th><th>PA</th><th>PAM</th><th>SpO₂</th><th>HGT</th><th>NEWS2</th><th>Rubrica</th><th>Reg. profissional</th></tr>${v.map(x=>`<tr><td>${hh(x)}${x.ed?'*':''}</td><td>${e_(x.t)}</td><td>${e_(x.fr)}</td><td>${e_(x.fc)}</td><td>${x.pas==null&&x.pad==null?'':e_(x.pas)+'/'+e_(x.pad)}</td><td>${e_(x.pam)}</td><td>${e_(x.sp)}</td><td>${e_(x.hgt)}</td><td>${e_(x.tot)}</td><td>${x.rub||''}</td><td>${(x.por||'').split(' · ')[1]||''}</td></tr>`).join('')}</table>`:'<div>Sem sinais vitais no plantão.</div>')+
   (pid&&bl.length?`<table style="width:100%;border-collapse:collapse;margin-top:4px"><tr><th>Hora</th><th>Infundido (mL)</th><th>Eliminado (mL)</th><th>Diurese (mL)</th><th>Outros</th></tr>${bl.map(b=>`<tr><td>${hh(b)}</td><td>${b.inf}</td><td>${b.eli}</td><td>${b.diu||0}</td><td style="text-align:left">${(b.itens||[]).map(i=>(i.t=='E'?'+':'−')+i.ml+' '+esc(i.nome)).join('; ')}</td></tr>`).join('')}</table>`:'')+`<div style="margin-top:3px">Infundido: <b>${I}</b> mL · Eliminado: <b>${E}</b> mL (diurese ${D} mL) · Balanço do plantão: <b>${sg2(I-E)}</b> mL${O.length?'<br>Outros: '+O.map(i=>(i.t=='E'?'+':'−')+i.ml+' '+esc(i.nome)).join('; '):''}</div></div>`}).join('')||'<p>Nenhum paciente.</p>')+sg+`</div>`};
 const resumo=()=>{const w0=win(0),w1=win(1),w={s0:w0.s0,e0:w1.e0};let T={dI:0,dE:0,nI:0,nE:0,I:0,E:0,D:0};
  const rows=L.map(p=>{const a=stat(p,w0),b=stat(p,w1),I=a.I+b.I,E=a.E+b.E,D=a.D+b.D;T.dI+=a.I;T.dE+=a.E;T.nI+=b.I;T.nE+=b.E;T.I+=I;T.E+=E;T.D+=D;
   return`<tr><td style="text-align:left">${p.ini} · ${p.leito}</td><td>${a.I}</td><td>${a.E}</td><td><b>${sg2(a.I-a.E)}</b></td><td>${b.I}</td><td>${b.E}</td><td><b>${sg2(b.I-b.E)}</b></td><td>${I}</td><td>${E}</td><td>${D}</td><td><b>${sg2(I-E)}</b></td></tr>`}).join('');
  return`<div style="break-before:page">`+hd('Resumo 24 h — Diurno + Noturno (balanço hídrico)',w)+`<table style="width:100%;border-collapse:collapse"><tr><th rowspan="2">Paciente · Leito</th><th colspan="3">Diurno 07–19</th><th colspan="3">Noturno 19–07</th><th colspan="4">Total 24 h</th></tr><tr><th>Inf.</th><th>Elim.</th><th>Bal.</th><th>Inf.</th><th>Elim.</th><th>Bal.</th><th>Inf.</th><th>Elim.</th><th>Diurese</th><th>Balanço</th></tr>${rows||'<tr><td colspan="11">Nenhum paciente.</td></tr>'}<tr style="font-weight:700"><td style="text-align:left">Total</td><td>${T.dI}</td><td>${T.dE}</td><td>${sg2(T.dI-T.dE)}</td><td>${T.nI}</td><td>${T.nE}</td><td>${sg2(T.nI-T.nE)}</td><td>${T.I}</td><td>${T.E}</td><td>${T.D}</td><td>${sg2(T.I-T.E)}</td></tr></table><p style="font-size:10px">Valores em mL. Balanço = infundido − eliminado.</p>`+sg+`</div>`};
 return sel==2?part(0,0)+part(1,1)+resumo():part(sel,0)}
